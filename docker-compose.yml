services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Firebase Configuration
      - FIREBASE_SERVICE_ACCOUNT_PATH=/app/serviceAccountKey.json
      
      # Railway Port (Railway sets this automatically)
      - PORT=${PORT:-8000}
    volumes:
      # Mount serviceAccountKey.json from host
      - ./backend/serviceAccountKey.json:/app/serviceAccountKey.json:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Vite environment variables (must start with VITE_)
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
      
      # Railway Port (Railway sets this automatically)
      - PORT=${PORT:-3000}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
